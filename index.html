<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanda</title>
<meta name="theme-color" content="#3a3d40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f3f3f2;--sf:#fff;--ink:#1c1c1e;--tx:#222426;--mu:#5c6063;--ln:#dcdddc;--br:#3a3d40;--bi:#fff;--c1:#f4b731;--c2:#f5a3c0;--c3:#a6dcc7;--c4:#a8cbf0;--c5:#f5a04a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--sf:#1f2022;--ink:#ececec;--tx:#e6e6e6;--mu:#a3a6a8;--ln:#36383b;--br:#c9ccce;--bi:#141516;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--sf:#1f2022;--ink:#ececec;--tx:#e6e6e6;--mu:#a3a6a8;--ln:#36383b;--br:#c9ccce;--bi:#141516;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Calibri,sans-serif}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 24px/1 Cambria,Georgia,serif;color:var(--ink);display:block}
.brand small{color:var(--mu);font-size:13px;font-style:italic}
.btn,select,input[type=search]{font:inherit;font-size:15px;padding:7px 12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px}
.btn{cursor:pointer}.btn:hover{border-color:var(--br)}
.btn.pri{background:var(--br);color:var(--bi);border-color:var(--br)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;max-width:1600px;margin:0 auto;padding:16px}
.rd{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:clamp(16px,4vw,36px)}
.lab{margin:0;color:var(--br);font-size:14px;font-weight:600}
h1{font:700 clamp(26px,4vw,36px)/1.15 Cambria,Georgia,serif;color:var(--ink);margin:4px 0 8px}
.hint{color:var(--mu);margin:0 0 12px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:6px;font:inherit;font-size:14px;padding:4px 12px 4px 8px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);color:var(--tx);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--br);box-shadow:0 0 0 2px var(--br)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.3);padding:0}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
#page{font:20px/1.75 Cambria,Georgia,serif;max-width:110ch}
#page p{margin:0 0 1.1em;white-space:pre-wrap}
#rm,#ocr{margin:0 0 12px;font-size:14px;padding:4px 10px}
#hint:empty{display:none}
#tov{position:fixed;inset:0;z-index:205}
#tsp{position:fixed;z-index:210;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.6);outline:3px solid #f4b731;pointer-events:none;transition:top .25s ease,left .25s ease,width .25s ease,height .25s ease}
#tcard{position:fixed;z-index:220;width:min(340px,calc(100vw - 24px));background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:14px 16px 14px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
#tcard .tk{margin:0 0 4px;font-size:13px;color:var(--mu)}
#tcard h3{margin:0 0 6px;font:700 20px/1.25 Cambria,Georgia,serif;color:var(--ink)}
#tcard .tx{margin:0 0 14px;font-size:16px;line-height:1.5}
#tcard .tr{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
#tcard .tl{margin-right:auto;font:inherit;font-size:14px;background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;padding:4px 0}
#sp{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s ease;animation:spOut .5s ease 4.2s forwards;cursor:pointer}
#sp.out{opacity:0;pointer-events:none}
.spl{filter:drop-shadow(0 8px 16px rgba(0,0,0,.22));animation:spPop .8s cubic-bezier(.2,1.5,.4,1) both}
#spt{min-height:1.6em;font:italic 22px/1.4 Cambria,Georgia,serif;color:var(--ink);letter-spacing:.4px}
#spt::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.12em;background:var(--br);animation:spBl 1s steps(1) infinite}
@keyframes spPop{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spBl{50%{opacity:0}}
@keyframes spOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@media (prefers-reduced-motion:reduce){.spl{animation:none}#sp{animation-delay:1.4s}}
.zm{display:flex;gap:8px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--mu)}
.zm .btn{padding:3px 12px}
#pdfbox{overflow-x:auto;max-width:100%}
#pdfbox.scan .pg{touch-action:none;cursor:crosshair}
.pg{position:relative;margin:0 auto 14px;background:#fff;color:#000;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.pg canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.hlp{position:absolute;inset:0;pointer-events:none}
.pr{position:absolute;mix-blend-mode:multiply;opacity:.6}
.pg .reg{pointer-events:none}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer ::selection{background:rgba(42,116,102,.4)}
#docbox{max-width:100%;overflow:auto}
.hl{color:#1a2b29;border-radius:3px;padding:1px 0;cursor:pointer}
.hl.has::after{content:"✎";font-size:.6em;margin-left:2px;vertical-align:super}
#imgbox{position:relative;touch-action:none;cursor:crosshair;border-radius:8px;overflow:hidden;border:1px solid var(--ln);max-width:100%}
#imgbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.reg{position:absolute;border:3px solid;border-radius:4px;cursor:pointer}
.rc1{border-color:var(--c1);background:rgba(244,183,49,.25)}.rc2{border-color:var(--c2);background:rgba(245,163,192,.3)}
.rc3{border-color:var(--c3);background:rgba(166,220,199,.3)}.rc4{border-color:var(--c4);background:rgba(168,203,240,.3)}.rc5{border-color:var(--c5);background:rgba(245,160,74,.3)}
.sb{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px;align-self:start;display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px)}
.sb h2{margin:0;font:700 20px Cambria,Georgia,serif;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mu)}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:60px;flex:1 1 auto;overflow:auto}
.item{border:1px solid var(--ln);border-left:7px solid var(--k);border-radius:6px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.item:hover{border-color:var(--br);border-left-color:var(--k)}
.item q{display:block;font:italic 15px/1.35 Cambria,Georgia,serif;quotes:"“" "”"}
.item p{margin:2px 0 0;font-size:14px;color:var(--mu)}
.empty{color:var(--mu);font-size:15px}
.foot{margin:0;font-size:13px;color:var(--mu)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
#mn{font-size:13px;padding:3px 10px}
.wrap.min{grid-template-columns:minmax(0,1fr) auto}
.sb.min>*:not(.sh){display:none}
.sb.min{padding:10px 12px}
#pal{position:fixed;z-index:30;display:flex;gap:10px;padding:8px 12px;background:var(--ink);border-radius:18px;flex-wrap:wrap;max-width:min(92vw,440px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
#pal .dot{width:30px;height:30px;cursor:pointer;border-color:#fff}
#pop{display:flex;flex-direction:column;min-width:260px;min-height:230px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);position:fixed;z-index:40;width:340px;background:#fff0b3;color:#1a2b29;padding:10px 12px 12px;border-radius:4px 4px 12px 4px;box-shadow:0 14px 34px rgba(0,0,0,.3);transform:rotate(-1deg)}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;cursor:grab}
#rz{position:absolute;right:2px;bottom:2px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 50%,rgba(0,0,0,.45) 50% 56%,transparent 56% 66%,rgba(0,0,0,.45) 66% 72%,transparent 72% 82%,rgba(0,0,0,.45) 82% 88%,transparent 88%)}
#pd{display:flex;flex-wrap:wrap;gap:6px;margin-right:auto}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.crow input[type=color]{width:44px;height:36px;padding:2px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);cursor:pointer}
.crow input[type=text]{flex:1;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
#pd .dot{width:22px;height:22px;cursor:pointer}
.dot[aria-pressed=true]{outline:2px solid #222;outline-offset:2px}
#pop .sm{font:inherit;font-size:13px;background:rgba(0,0,0,.08);border:0;border-radius:6px;padding:4px 9px;cursor:pointer;color:#222}
#pop .sm[aria-pressed=true]{background:#222;color:#fff}
#pq{margin:8px 0 0;font:italic 14px/1.35 Cambria,Georgia,serif;color:#5a5640;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ta,#tg{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(0,0,0,.35);color:#1a2b29;font:inherit}
#ta{flex:1 1 140px;min-height:90px;margin-top:6px;font:italic 17px/1.5 Cambria,Georgia,serif;resize:none}
#tg{margin-top:8px;font-size:14px;padding:4px 0}
#cw{flex:1 1 200px;min-height:190px;margin-top:6px;display:flex;flex-direction:column;gap:6px}#cs{flex:1 1 140px;min-height:140px;overflow:auto;touch-action:none}#pw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}#ci{margin-left:auto}#pop.pen{transform:none}#pop.pen #pq{display:none}#cv{display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(transparent 0 29px,rgba(0,0,0,.14) 29px 30px)}
dialog{max-width:560px;width:calc(100% - 32px);border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);padding:18px}
dialog textarea{width:100%;height:260px;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:10px}
dialog .row{margin-top:10px;justify-content:flex-end}
@media (max-width:800px){.wrap,.wrap.min{grid-template-columns:1fr}.brand small{display:none}.sb{position:static;max-height:none}#list{max-height:50vh}}
@media (max-width:700px){#rz{display:none}#pop{width:auto!important;height:auto!important;left:0!important;right:0;bottom:0;top:auto!important;width:auto;transform:none;border-radius:14px 14px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
</style>
<style id="ccss"></style>
</head>
<body>
<div id="sp" aria-hidden="true"><div id="spt"></div></div>
<header class="top">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#2a7466"/><g transform="rotate(-5 256 262)"><rect x="136" y="116" width="240" height="304" rx="20" fill="#ffd84d"/><path d="M136 136a20 20 0 0 1 20-20h200a20 20 0 0 1 20 20v28H136z" fill="#f4b731"/><g fill="#123b36"><rect x="176" y="96" width="14" height="40" rx="7"/><rect x="226" y="96" width="14" height="40" rx="7"/><rect x="276" y="96" width="14" height="40" rx="7"/><rect x="326" y="96" width="14" height="40" rx="7"/></g><g fill="none" stroke="#123b36" stroke-width="15" stroke-linecap="round"><path d="M186 232C188 214 214 206 236 214C272 204 308 204 336 218"/><path d="M262 212C252 262 250 306 236 338C226 360 198 360 198 340C198 322 230 320 250 336"/></g><path d="M168 386C198 364 214 406 248 378S292 402 322 376S350 388 358 380" fill="none" stroke="#2a7466" stroke-width="10" stroke-linecap="round"/></g></svg>
    <div><b>Tanda</b><small>Tanda-i. Markahi. Panumdumi.</small></div>
  </div>
  <label><span style="position:absolute;left:-9999px">Choose a reading</span><select id="rsel"></select></label>
  <label class="btn" for="up">Add reading</label><input id="up" type="file" hidden>
  <button class="btn" id="th" aria-label="Switch between light and dark theme">Light or dark</button>
<button class="btn" id="tourbtn" aria-label="Take a quick tour of Tanda">? Tour</button>
</header>
<main class="wrap">
  <section class="rd">
    <p class="lab" id="lab"></p>
    <h1 id="ttl"></h1>
    <p class="hint" id="hint" aria-live="polite"></p>
    <button class="btn" id="rm" hidden>Remove this reading</button>
    <button class="btn" id="ocr" hidden>Also make a selectable text version (reads the scan)</button>
    <div class="chips" id="chips" role="group" aria-label="Highlight meanings"></div>
    <div class="zm" id="zm" hidden><button class="btn" id="zo" aria-label="Zoom out">−</button><span id="zl">100%</span><button class="btn" id="zi" aria-label="Zoom in">+</button><button class="btn" id="zf">Fit width</button></div>
    <div id="page"></div>

    <div id="pdfbox" hidden></div>
    <div id="docbox" hidden></div><div id="docsty" hidden></div>
    <div id="imgbox" hidden></div>
  </section>
  <aside class="sb">
    <div class="sh"><h2>Notes <span id="cnt"></span></h2><button class="btn" id="mn" aria-expanded="true">Hide</button></div>
    <p class="foot" id="sbt"></p>
    <input id="q" type="search" placeholder="Search notes and tags" aria-label="Search notes and tags">
    <div class="row"><select id="f" aria-label="Filter by color"><option value="">All colors</option></select></div>
    <ul id="list"></ul>
    <button class="btn pri" id="ex">Export notes</button>
    <p class="foot">Notes and readings are saved in this browser, on this device.</p>
  </aside>
</main>
<div id="pal" hidden></div>
<div id="pop" hidden role="dialog" aria-label="Sticky note">
  <div class="ph"><span id="pd"></span><button class="sm" id="mt" aria-pressed="true">Type</button><button class="sm" id="mp" aria-pressed="false">Pen</button><button class="sm" id="del">Delete</button><button class="sm" id="cl" aria-label="Close note">Close</button></div>
  <p id="pq"></p>
  <textarea id="ta" placeholder="Why did you mark this?" aria-label="Note"></textarea>
  <div id="cw" hidden><div id="cs"><canvas id="cv" aria-label="Handwritten note"></canvas></div><div id="pw"><button class="sm" data-w="1.5">Thin</button><button class="sm" data-w="3">Medium</button><button class="sm" data-w="6">Thick</button><button class="sm" data-w="11">Marker</button><button class="sm" id="ci">Clear</button></div></div>
  <input id="tg" placeholder="Tags, separated by commas" aria-label="Tags">
  <span id="rz" role="separator" aria-label="Resize note" title="Drag to resize"></span>
</div>
<dialog id="cdlg"><h2 style="margin:0 0 6px;font:700 20px Cambria,Georgia,serif">Your highlighter colors</h2><p class="foot" style="margin:0 0 12px">Pick a color and give it a meaning. Changes apply to all your readings.</p><div id="crows"></div><div class="row" style="justify-content:flex-start"><button class="btn" id="cadd">Add a color</button><button class="btn" id="crst">Reset to defaults</button></div><div class="row"><button class="btn pri" id="cdx">Done</button></div></dialog>
<dialog id="dlg"><h2 style="margin:0 0 10px;font:700 20px Cambria,Georgia,serif">Your notes</h2><label class="row" style="justify-content:flex-start;margin:0 0 8px"><input type="checkbox" id="exall"> Include notes from all readings</label><textarea id="out" readonly aria-label="Exported notes"></textarea><div class="row"><button class="btn" id="dx">Close</button><button class="btn pri" id="cp">Copy notes</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const NAMES={1:'Key term',2:'Definition',3:'General topic',4:'Subtopic',5:'Enumeration'};
const feed='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"><rect width="800" height="520" fill="#efe9dc"/><rect x="60" y="40" width="680" height="440" rx="24" fill="#fff"/><circle cx="120" cy="105" r="30" fill="#2a7466"/><text x="165" y="100" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#123b36">@maria.reads</text><text x="165" y="130" font-family="Arial,sans-serif" font-size="20" fill="#6b7d78">posted 2 minutes ago</text><text font-family="Georgia,serif" font-size="40" font-style="italic" fill="#1a2b29"><tspan x="100" y="230">i left the tab open</tspan><tspan x="100" y="290">and the poem kept loading</tspan><tspan x="100" y="350">(every refresh, a new ending)</tspan></text><text x="100" y="430" font-family="Arial,sans-serif" font-size="24" fill="#2a7466">1.2k likes   86 replies   #poetry #newmedia</text></svg>');
const R=[
 {id:'r0',type:'text',title:'A Letter to Us',label:'Before we begin',body:[
  'To us,\nwho think, learn, and wonder,',
  'A little space for everything we ought to remember.',
  'For the lessons we learn, the words we love, the new ideas we discover, and the thoughts we have yet to understand.',
  'This page is ours.']},
 {id:'r1',type:'text',title:'The Page Moves',label:'Hypertext, week 3',body:[
  'A hypertext poem does not unfold the same way twice. Each reader arrives with a different history, clicks a different link, and leaves with a different poem.',
  'In a printed book, the author decides the order. Here, every link is a decision, and every decision rewrites the path. The reader becomes a kind of co-author, and the interface becomes part of the meaning.',
  'So what does it mean to annotate such a text? A note cannot only point to a line. It has to remember the route that led there, and the reason the reader stopped.']},
 {id:'r2',type:'image',title:'A poem in the feed',label:'Social media writing, week 5',src:feed}
];
let S={A:[],th:'',seeded:0},cur=1,rid='r0',cn=null,dirty=false;
try{const j=JSON.parse(localStorage.getItem('tanda:v1'));if(j&&j.A)S=j}catch(e){}
const save=()=>{try{localStorage.setItem('tanda:v1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const rd=()=>R.find(r=>r.id===rid);
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('tanda',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const kvGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const kvSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)})};
const saveR=async()=>{try{await kvSet('readings',R.filter(r=>r.mine||r.up));return true}catch(e){return false}};
async function loadR(){
  let a=[];try{a=(await kvGet('readings'))||[]}catch(e){}
  try{const old=JSON.parse(localStorage.getItem('tanda:r'))||[];old.forEach(o=>{if(!a.some(x=>x.id===o.id))a.push(o)})}catch(e){}
  a.forEach(r=>{if(!R.some(x=>x.id===r.id))R.push(r)});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(a.length){fillSel();render();saveR().then(ok=>{if(ok)try{localStorage.removeItem('tanda:r')}catch(e){}})}
}
if(!S.seeded){const k='every link is a decision',i=R.find(r=>r.id==='r1').body.join('').indexOf(k);S.A.push({id:uid(),rid:'r1',kind:'t',s:i,e:i+k.length,c:1,q:k,txt:'Whose decision is it, the author’s or the reader’s? Compare with the Twine example.',ink:'',tags:'hypertext, authorship'});S.seeded=1;save()}

/* theme */
const isDark=()=>S.th?S.th==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const applyTh=()=>{document.documentElement.dataset.theme=S.th};
$('#th').onclick=()=>{S.th=isDark()?'light':'dark';applyTh();save()};
applyTh();

/* setup controls */
function fillSel(){const s=$('#rsel');s.innerHTML='';R.forEach(r=>{const o=mk('option',0,r.title);o.value=r.id;s.append(o)});s.value=rid}
$('#rsel').onchange=e=>{rid=e.target.value;hidePop();render()};
const DEF={1:['Key term','#f4b731'],2:['Definition','#f5a3c0'],3:['General topic','#a6dcc7'],4:['Subtopic','#a8cbf0'],5:['Enumeration','#f5a04a']};
const defCols=()=>{const o={};Object.keys(DEF).forEach(k=>{o[k]={n:DEF[k][0],h:DEF[k][1]}});return o};
let COL=S.cols&&Object.keys(S.cols).length?S.cols:defCols();

/* upload and export */
const note=m=>{$('#hint').textContent=m};
const loadJS=u=>new Promise((ok,no)=>{if(document.querySelector('script[src="'+u+'"]'))return ok();const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Could not load the file reader. Check your connection and try again.'));document.head.append(s)});
const paras=t=>{t=t.replace(/\r/g,'');const a=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);return a.length>1?a:t.split('\n').map(x=>x.trim()).filter(Boolean)};
async function readPdf(buf){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadJS(base+'pdf.min.js');await loadJS(base+'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];
  for(let n=1;n<=pdf.numPages;n++){
    const tc=await(await pdf.getPage(n)).getTextContent(),lines=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=Math.round(it.transform[5]),h=it.height||10,L=lines[lines.length-1];
      if(L&&Math.abs(L.y-y)<h*.5)L.t+=it.str;else lines.push({y,t:it.str})});
    const gaps=lines.slice(1).map((l,i)=>Math.abs(lines[i].y-l.y)).sort((a,b)=>a-b),med=gaps[Math.floor(gaps.length/2)]||12;
    let cur='';
    lines.forEach((l,i)=>{const t=l.t.trim();if(!t)return;
      if(i>0&&Math.abs(lines[i-1].y-l.y)>med*1.5&&cur){out.push(cur);cur=''}
      if(cur&&/\w-$/.test(cur))cur=cur.slice(0,-1)+t;else cur+=(cur?' ':'')+t});
    if(cur)out.push(cur);
  }
  if(out.join('').length<30*pdf.numPages)return ocrPdf(pdf);
  return out;
}
async function ocrPdf(pdf){
  let sample=null,lim=null;
  try{sample=await claude.use('sample');lim=sample&&await sample.limits()}catch(e){}
  if(!sample||!lim||!lim.images)throw new Error('This PDF is a scan with no selectable text, and reading scans needs Claude, which isn’t available here. Open Tanda inside Claude to read it.');
  const total=Math.min(pdf.numPages,20),out=[];
  for(let n=1;n<=total;n++){
    note('Claude is reading scanned page '+n+' of '+total+'…');
    const page=await pdf.getPage(n),vp=page.getViewport({scale:1.6}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85));
    try{
      const r=await sample('Transcribe all the text on this scanned page exactly as written, in its original language. Separate paragraphs with a blank line and join the lines inside each paragraph. Do not add comments, headings, or explanations. If the page has no text, reply with exactly: [blank page]',{images:[blob],modelTier:'quick',cache:false});
      r.text.split(/\n\s*\n/).map(x=>x.replace(/\s*\n\s*/g,' ').trim()).filter(x=>x&&x!=='[blank page]').forEach(x=>out.push(x));
    }catch(e){
      if(!out.length)throw new Error(e.code==='not_granted'?'Reading scans needs your OK to let Claude read the pages. Add the PDF again and allow it.':e.code==='rate_limited'?'Your Claude usage limit was reached. Try again later.':'Claude couldn’t read this scan. Please try again.');
      out.push('(Reading stopped at page '+n+'.)');break;
    }
  }
  if(pdf.numPages>total)out.push('(Only the first '+total+' pages of this scan were read.)');
  return out;
}
async function readDocx(buf){await loadJS('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');return paras((await mammoth.extractRawText({arrayBuffer:buf})).value)}
const fromHtml=h=>{const d=new DOMParser().parseFromString(h.replace(/<(script|style)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>|<\/(p|div|h\d|li|tr|blockquote)>/gi,'\n\n'),'text/html');return paras(d.body.textContent)};
const fromRtf=r=>paras(r.replace(/\\pard?/g,'\n\n').replace(/\{\\\*[^}]*\}/g,'').replace(/\\'[0-9a-f]{2}/gi,'').replace(/\\[a-z]+-?\d* ?/gi,'').replace(/[{}]/g,''));
async function ingest(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase(),title=f.name.replace(/\.[^.]+$/,'')||'Untitled reading',id='u'+uid();
  note('Opening '+f.name+'…');let saved=true,fileOk=true;
  try{
    if(f.type.startsWith('image/')){
      const src=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(f)});
      R.push({id,type:'image',title,label:'Uploaded image',src,up:1});
    }else{

        try{

          else{await loadJS(JSZIP);await loadJS(DOCXP);extra.label='Word document'}

      else{const t=await f.text();if(t.slice(0,2000).indexOf('\u0000')>-1)throw new Error('Tanda can’t read this kind of file. Try PDF, DOCX, plain text, HTML, or an image.');body=paras(t)}
      if(!exact&&!body.length)throw new Error('No readable text found in this file. A clearer scan or an image may work better.');
      if(body.join('').length>1500000)throw new Error('This file is very long. Try adding one chapter at a time.');
      if(!exact)R.push({id,type:'text',title,label:'Your reading ('+(ext||'text')+')',body,mine:1});
    }
    saved=(await saveR())&&fileOk;
    rid=id;fillSel();hidePop();render();
    if(!saved)note('This file is too large to keep in your browser, so it will be gone when you close the page.');
  }catch(err){note(err.message||'Something went wrong while opening that file.')}
}

const pgObs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?drawPg(e.target):undraw(e.target)),{rootMargin:'800px 0px'});

async function drawPg(d){
  if(d._busy){d._again=true;return}
  const s=pgScale();if(d._k===s)return;
  d._busy=true;
  try{
    const page=await pdfDoc.getPage(+d.dataset.n),vp=page.getViewport({scale:s}),dpr=Math.min(devicePixelRatio||1,2);
    d.style.width=vp.width+'px';d.style.height=vp.height+'px';
    let c=d.querySelector('canvas');if(!c){c=document.createElement('canvas');d.prepend(c)}
    c.width=vp.width*dpr;c.height=vp.height*dpr;
    await page.render({canvasContext:c.getContext('2d'),viewport:page.getViewport({scale:s*dpr})}).promise;
    const old=d.querySelector('.textLayer');if(old)old.remove();
    const tl=mk('div','textLayer');tl.style.setProperty('--scale-factor',s);d.append(tl);
    pdfjsLib.renderTextLayer({textContentSource:await page.getTextContent(),container:tl,viewport:vp,textDivs:[]});

}
async function renderPdf(r){

  if(pdfRid===r.id&&pdfDoc&&box.querySelector('.pg')){paintPdf(r);return}

    if(pdfRid!==r.id)return;

    pdfDoc=doc;box.textContent='';
    for(let n=1;n<=doc.numPages;n++){const d=mk('div','pg');d.dataset.n=n;d.dataset.w=vp.width;d.dataset.h=vp.height;d.append(mk('div','hlp'));box.append(d)}

function fitDoc(){

function paintDoc(){
  const box=$('#docbox');

  const hs=S.A.filter(a=>a.rid===rid&&a.kind==='t').sort((a,b)=>a.s-b.s);if(!hs.length)return;
  const w=document.createTreeWalker(box,NodeFilter.SHOW_TEXT),segs=[];let off=0,n;
  while(n=w.nextNode()){const L=n.data.length;hs.forEach(h=>{const s=Math.max(h.s,off),e=Math.min(h.e,off+L);if(e>s)segs.push({n,s:s-off,e:e-off,h})});off+=L}

let ti=-1;
function tourPlace(){
  if(ti<0)return;
  const s=TOUR[ti],c=$('#tcard'),sp=$('#tsp'),ov=$('#tov');if(!c)return;
  let r=null;const el=s.el&&s.el();
  if(el){const b=el.getBoundingClientRect();if(b.width>0&&b.height>0)r=b}
  const vw=innerWidth,vh=innerHeight,cw=c.offsetWidth,ch=c.offsetHeight,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(!r){sp.style.display='none';ov.style.background='rgba(0,0,0,.6)';c.style.left=cl((vw-cw)/2,12,vw)+'px';c.style.top=cl((vh-ch)/2,12,vh)+'px';return}
  sp.style.display='block';ov.style.background='transparent';
  const top=Math.max(4,r.top-6),left=Math.max(4,r.left-6),bottom=Math.min(vh-4,r.bottom+6),right=Math.min(vw-4,r.right+6);
  Object.assign(sp.style,{top:top+'px',left:left+'px',width:(right-left)+'px',height:(bottom-top)+'px'});
  let x,y;const g=14;
  if(vw<=700){x=(vw-cw)/2;y=vh-ch-12}
  else if(vh-bottom>=ch+g+8){y=bottom+g;x=left+(right-left)/2-cw/2}
  else if(top>=ch+g+8){y=top-ch-g;x=left+(right-left)/2-cw/2}
  else if(left>=cw+g+8){x=left-cw-g;y=top}
  else if(vw-right>=cw+g+8){x=right+g;y=top}
  else{x=(vw-cw)/2;y=vh-ch-16}
  c.style.left=cl(x,12,vw-cw-12)+'px';c.style.top=cl(y,12,vh-ch-12)+'px';
}
function tourShow(n){
  ti=n;const s=TOUR[n],c=$('#tcard'),last=n===TOUR.length-1;

}
